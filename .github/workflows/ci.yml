name: MLOps CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-api.txt
      - name: Reproduce DVC pipeline
        run: dvc repro
      - name: Run tests
        run: pytest
      - name: Smoke-test prediction CLI
        run: python -m src.models.predict_model data/raw/weather.csv models/weather_model.joblib /tmp/weather-predictions.csv
      - name: Enforce release F1 threshold
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json

          with open("reports/metrics.json", encoding="utf-8") as metrics_file:
              f1 = json.load(metrics_file)["f1"]
          minimum_f1 = 0.70
          print(f"F1: {f1:.3f} (minimum: {minimum_f1:.2f})")
          if f1 < minimum_f1:
              raise SystemExit("Release blocked: F1 is below the required threshold.")
          PY
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp models/weather_model.joblib release/
          cp reports/metrics.json release/
      - name: Upload release assets for publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: model-release-assets
          path: release/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download model release assets
        uses: actions/download-artifact@v4
        with:
          name: model-release-assets
          path: release
      - name: Add model to container build context
        run: |
          mkdir -p models
          cp release/weather_model.joblib models/weather_model.joblib
      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/weather_model.joblib release/metrics.json --clobber
      - name: Prepare container image metadata
        id: image-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MODEL_VERSION=${{ github.ref_name }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}